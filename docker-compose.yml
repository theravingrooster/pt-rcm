services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pt
      POSTGRES_PASSWORD: pt
      POSTGRES_DB: pt_rcm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pt -d pt_rcm"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - pt_rcm_pg:/var/lib/postgresql/data

volumes:
  pt_rcm_pg:
