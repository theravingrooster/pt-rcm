name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://pt:pt@localhost:5432/pt_rcm
      TEST_DATABASE_URL: postgres://pt:pt@localhost:5432/pt_rcm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up workspace
        run: bash scripts/cloud-setup.sh
      - name: Start PostgreSQL 16
        run: docker compose up -d --wait
      - name: Apply migrations and confirm rerun
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - name: Seed synthetic configuration twice
        run: |
          pnpm db:seed
          pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the Next.js app
        run: pnpm --filter @pt-rcm/web build
      - name: Ingest, scrub, and read the synthetic document through HTTP
        run: |
          pnpm --filter @pt-rcm/web exec next start > /tmp/pt-rcm-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" || true; cat /tmp/pt-rcm-web.log' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/api/health
          pnpm seed:demo
          pnpm seed:demo
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const body = JSON.parse(await readFile('fixtures/encounters/shoulder-23min.json', 'utf8'));
          body.minuteLines = [{ cptCode: '97110', minutes: 20 }, { cptCode: '97530', minutes: 20 }];
          const ingested = await fetch('http://localhost:3000/api/encounters', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
          });
          assert.equal(ingested.status, 200);
          const { encounterId } = await ingested.json();
          const response = await fetch(`http://localhost:3000/api/encounters/${encounterId}/scrub`, { method: 'POST' });
          assert.equal(response.status, 200);
          const scrubbed = await response.json();
          assert.equal(scrubbed.status, 'SCRUBBED');
          assert.equal(scrubbed.totalUnits, 3);
          assert.equal(scrubbed.totalChargeCents, 13500);
          assert.ok(scrubbed.lines.every(line => line.modifiers.includes('GP')));
          assert.equal(scrubbed.findings.length, 8);
          const documentResponse = await fetch(`http://localhost:3000/api/claims/${scrubbed.claimId}/document`);
          assert.equal(documentResponse.status, 200);
          assert.equal(documentResponse.headers.get('cache-control'), 'no-store');
          const pretty = await documentResponse.text();
          const document = JSON.parse(pretty);
          assert.equal(pretty, JSON.stringify(document, null, 2) + '\n');
          assert.deepEqual(document.lines.map(line => [line.units, line.modifiers]), [[2, ['GP']], [1, ['GP']]]);
          assert.equal(document.totalChargeCents, 13500);
          assert.equal(document.billingProvider.tin, 'SYN-TAX-1');
          assert.equal(document.benefitsAssigned, true);
          assert.equal(document.acceptAssignment, true);
          JS
      - name: Check migration drift
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain -- packages/db/drizzle)"
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
