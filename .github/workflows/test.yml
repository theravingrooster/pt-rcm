name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://pt:pt@localhost:5432/pt_rcm
      TEST_DATABASE_URL: postgres://pt:pt@localhost:5432/pt_rcm
      CLEARINGHOUSE_ADAPTER: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up workspace
        run: bash scripts/cloud-setup.sh
      - name: Start PostgreSQL 16
        run: docker compose up -d --wait
      - name: Apply migrations and confirm rerun
        run: |
          pnpm db:migrate
          pnpm db:migrate
      - name: Seed synthetic configuration twice
        run: |
          pnpm db:seed
          pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the Next.js app
        run: pnpm --filter @pt-rcm/web build
      - name: Verify claim and task workflows through HTTP
        run: |
          pnpm --filter @pt-rcm/web exec next start > /tmp/pt-rcm-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" || true; cat /tmp/pt-rcm-web.log' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/api/health
          pnpm seed:demo
          pnpm seed:demo
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const body = JSON.parse(await readFile('fixtures/encounters/shoulder-23min.json', 'utf8'));
          body.minuteLines = [{ cptCode: '97110', minutes: 20 }, { cptCode: '97530', minutes: 20 }];
          const ingested = await fetch('http://localhost:3000/api/encounters', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
          });
          assert.equal(ingested.status, 200);
          const { encounterId } = await ingested.json();
          const response = await fetch(`http://localhost:3000/api/encounters/${encounterId}/scrub`, { method: 'POST' });
          assert.equal(response.status, 200);
          const scrubbed = await response.json();
          assert.equal(scrubbed.status, 'SCRUBBED');
          assert.equal(scrubbed.totalUnits, 3);
          assert.equal(scrubbed.totalChargeCents, 13500);
          assert.ok(scrubbed.lines.every(line => line.modifiers.includes('GP')));
          assert.equal(scrubbed.findings.length, 8);
          const documentResponse = await fetch(`http://localhost:3000/api/claims/${scrubbed.claimId}/document`);
          assert.equal(documentResponse.status, 200);
          assert.equal(documentResponse.headers.get('cache-control'), 'no-store');
          const pretty = await documentResponse.text();
          const document = JSON.parse(pretty);
          assert.equal(pretty, JSON.stringify(document, null, 2) + '\n');
          assert.deepEqual(document.lines.map(line => [line.units, line.modifiers]), [[2, ['GP']], [1, ['GP']]]);
          assert.equal(document.totalChargeCents, 13500);
          assert.equal(document.billingProvider.tin, 'SYN-TAX-1');
          assert.equal(document.benefitsAssigned, true);
          assert.equal(document.acceptAssignment, true);
          const submitUrl = `http://localhost:3000/api/claims/${scrubbed.claimId}/submit`;
          const submitted = await fetch(submitUrl, { method: 'POST' });
          assert.equal(submitted.status, 200);
          const receipt = await submitted.json();
          assert.equal(receipt.status, 'SUBMITTED');
          assert.equal(receipt.icn, `SYN-ICN-${scrubbed.claimId}`);
          assert.equal(receipt.acknowledgment.status, 'accepted-for-processing');
          assert.equal((await fetch(submitUrl, { method: 'POST' })).status, 409);
          delete body.planOfCare;
          body.externalId = 'SYN-HTTP-TASK';
          body.patient.externalId = 'SYN-HTTP-TASK-PATIENT';
          const blockedIngest = await fetch('http://localhost:3000/api/encounters', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
          });
          assert.equal(blockedIngest.status, 201);
          const blockedEncounter = await blockedIngest.json();
          const blockedResponse = await fetch(`http://localhost:3000/api/encounters/${blockedEncounter.encounterId}/scrub`, { method: 'POST' });
          assert.equal(blockedResponse.status, 200);
          const blocked = await blockedResponse.json();
          assert.equal(blocked.status, 'BLOCKED');
          const taskResponse = await fetch('http://localhost:3000/api/tasks?status=OPEN');
          assert.equal(taskResponse.status, 200);
          assert.equal(taskResponse.headers.get('cache-control'), 'no-store');
          const tasks = (await taskResponse.json()).tasks.filter(task => task.claimId === blocked.claimId);
          assert.equal(tasks.length, 1);
          assert.equal(tasks[0].kind, 'RULE_BLOCK');
          assert.equal(tasks[0].owner, 'OPERATOR');
          const doneUrl = `http://localhost:3000/api/tasks/${tasks[0].id}/done`;
          for (let attempt = 0; attempt < 2; attempt++) {
            const done = await fetch(doneUrl, { method: 'POST' });
            assert.equal(done.status, 200);
            assert.equal((await done.json()).task.status, 'DONE');
          }
          const open = await (await fetch('http://localhost:3000/api/tasks?status=OPEN')).json();
          assert.ok(!open.tasks.some(task => task.id === tasks[0].id));
          const done = await (await fetch('http://localhost:3000/api/tasks?status=DONE')).json();
          assert.ok(done.tasks.some(task => task.id === tasks[0].id));
          JS
      - name: Check migration drift
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain -- packages/db/drizzle)"
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
